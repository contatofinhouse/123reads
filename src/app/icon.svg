<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Neo-brutalist solid offset shadow -->
  <rect x="48" y="48" width="416" height="416" rx="64" fill="#121212"/>
  <!-- Main white block -->
  <rect x="24" y="24" width="416" height="416" rx="64" fill="#ffffff" stroke="#121212" stroke-width="16"/>
  
  <!-- Book Cover Background -->
  <rect x="160" y="100" width="240" height="312" rx="12" fill="#e62429" stroke="#121212" stroke-width="16"/>
  <!-- Book Spine / Pages Edge -->
  <path d="M160 100 v312 c-24 0 -48-12 -48-32 V132 c0-20 24-32 48-32 Z" fill="#ffffff" stroke="#121212" stroke-width="16" stroke-linejoin="round"/>
  
  <!-- "123" Text in white on red book cover -->
  <text x="280" y="290" font-family="'Inter', -apple-system, sans-serif" font-size="100" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">123</text>
</svg>
